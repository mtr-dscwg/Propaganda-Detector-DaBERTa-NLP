[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ptc"
version = "0.1.0"
description = "Two-stage propaganda detector (SI -> TC) on PTC-SemEval20"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "sentencepiece",
    "protobuf",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end smoke test that trains tiny models"]
